name: Test local deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  local-deployment:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Clean install
        run: npm ci
      - name: Prepare local runtimes and verified OCR models
        run: npm run prepare:demo
      - name: JavaScript and HTTP regression tests
        run: npm test
      - name: Python calculation regression tests
        run: npm run test:core
      - name: Native Python / WebAssembly parity
        run: npm run test:wasm
      - name: Start without Python on PATH
        run: npm run test:smoke
      - name: Audit public source and assets
        run: npm run audit:release
